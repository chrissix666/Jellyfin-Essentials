        border-radius: 3px; color: inherit; padding: 0 8px; font-size: 13px; font-family: inherit; }
    #EssentialsConfigPage .esArea { max-width: 320px; width: 100%; min-height: 64px; box-sizing: border-box; background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; color: inherit; padding: 6px 8px; font-size: 13px; font-family: inherit; }
    #EssentialsConfigPage .esColor { width: 60px; height: 30px; padding: 2px; box-sizing: border-box; background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.2); border-radius: 3px; cursor: pointer; }
    #EssentialsConfigPage input[type=checkbox].esCheck { appearance: none; -webkit-appearance: none; width: 16px; height: 16px; margin: 0; border-radius: 3px;
        color: inherit; border: 0.14em solid currentColor; position: relative; cursor: pointer; flex: 0 0 auto; }

    #EssentialsConfigPage .esArrow { width: 26px; height: 24px; border: 1px solid rgba(255,255,255,0.25); border-radius: 3px; background: rgba(255,255,255,0.08);

    #EssentialsConfigPage .esActionButton { min-width: 112px; height: 29px; font-size: 12px; border: 1px solid rgba(255,255,255,.25); border-radius: 3px;

    #EssentialsConfigPage .esRed { background: #3a1f1f !important; border-color: #6b3535 !important; color: #e0a0a0 !important; }

    #EssentialsConfigPage .esStatus.esOk { color: #6dcf6d; }
    #EssentialsConfigPage .esStatus.esError { color: #e07a7a; }

    @container espage (max-width: 803.98px) {
        #EssentialsConfigPage .esRow { grid-template-columns: 1fr; }

<h2>Essentials</h2>
<p class="esIntro">Eight additions for Jellyfin Web, each with its own switch and settings.<br>The header buttons, those of Globe, Cinema Project and Destroy too, stand in the order set here.</p>
<div id="esTabBar"></div>
<form id="EssentialsConfigForm">
    <div id="esPages"></div>
    <div class="esSave"><button is="emby-button" type="submit" class="raised button-submit block emby-button"><span>Save</span></button></div>
</form>
</div></div>
<script type="text/javascript">
(function () {
    var EssentialsConfig = { pluginUniqueId: '55e8663a-5672-4656-a3ec-a900d634b73b' };
    var page = document.getElementById('EssentialsConfigPage');

    // ---------- the settings of every script ----------
    // path: where the value lives in the script (its own variable, then the keys inside it); def: the script's default.
    function opts(list) { return list.map(function (v) { return Array.isArray(v) ? v : [v, v]; }); }
    var SORTS = opts(['PremiereDate', 'ProductionYear', 'SortName', 'DateCreated', 'CommunityRating', 'CriticRating', 'Runtime', 'Random']);
    var ORDERS = opts(['Ascending', 'Descending']);
    var RATINGS_SOURCES = [['imdb', 1, 'IMDb'], ['tmdb', 2, 'TMDb'], ['rt_critics', 3, 'Rotten Tomatoes Critics'], ['rt_audience', 4, 'Rotten Tomatoes Audience'],
        ['metacritic', 5, 'Metacritic'], ['metacritic_user', 6, 'Metacritic User'], ['trakt', 7, 'Trakt'], ['letterboxd', 8, 'Letterboxd'],
        ['roger_ebert', 9, 'Roger Ebert'], ['kinopoisk', 10, 'Kinopoisk'], ['myanimelist', 11, 'MyAnimeList']];

    function ratingsFields(c, movie) {
        var f = [
            { path: c + '.UI_JELLYFIN_DB_RATINGS_MODE', label: 'Jellyfin Ratings', type: 'select', def: 'rating_only',
                options: [['both', 'Community and Critics'], ['rating_only', 'Community Only'], ['critics_only', 'Critics Only'], ['hide', 'None']],
                desc: 'Which of Jellyfin\'s own ratings stay in the line.' },
            { path: c + '.UI_DEACTIVATE_JELLYFIN_EXTRA_RATINGS', label: 'Hide Outside Ratings', type: 'bool', def: false, desc: 'Shows no ratings from MDBList at all.' },
            { path: c + '.UI_INTERNAL_RATINGS_NEW_LINE_MOVE', label: 'Jellyfin Ratings on Own Line', type: 'bool', def: true, desc: 'Moves Jellyfin\'s own ratings to a second line.' },
            { path: c + '.UI_EXTERNAL_RATINGS_NEW_LINE', label: 'Outside Ratings on Own Line', type: 'bool', def: true, desc: 'Shows the MDBList ratings on a line of their own.' }
        ];
        if (movie) f.push(
            { path: c + '.ENDING_AT_MODE', label: 'Ends At', type: 'bool', def: true, desc: 'Shows when the movie ends.' },
            { path: c + '.ENDING_AT_POSITION_MODE', label: 'Ends At Position', type: 'select', def: 'vanilla',
                options: [['vanilla', 'As Jellyfin Places It'], ['begin', 'Start of the Line'], ['end', 'End of the Line']], desc: 'Where "Ends at" stands within its line.' },
            { path: c + '.ENDING_AT_LINE_MODE', label: 'Ends At Line', type: 'select', def: 'main',
                options: [['main', 'Main Line'], ['after_main', 'Line After the Main Line'], ['after_external', 'Line After the Outside Ratings'], ['same_external', 'Line of the Outside Ratings']],
                desc: 'Which line "Ends at" goes to.' });
        f.push(
            { path: c + '.UI_CRITICSRATING_ICON_FRESH', label: 'Fresh Icon', type: 'bool', def: true, desc: 'Shows Jellyfin\'s critics rating with the fresh tomato from a set score.' },
            { path: c + '.UI_CRITICSRATING_ICON_FRESH_SCORE', label: 'Fresh From', type: 'number', def: 6.0, min: 0, max: 10, step: 0.1, desc: 'The score (0 to 10) from which the fresh tomato is shown.' },
            { path: c + '.UI_CRITICSRATING_ICON_CERTIFIED', label: 'Certified Icon', type: 'bool', def: true, desc: 'Shows Jellyfin\'s critics rating with the certified icon from a set score.' },
            { path: c + '.UI_CRITICSRATING_ICON_CERTIFIED_SCORE', label: 'Certified From', type: 'number', def: 9.0, min: 0, max: 10, step: 0.1, desc: 'The score (0 to 10) from which the certified icon is shown.' },
            { path: c + '.UI_RT_ICON_CERTIFIED', label: 'Rotten Tomatoes Certified', type: 'bool', def: true, desc: 'Shows the Rotten Tomatoes rating from MDBList with the certified icon from a set score.' },
            { path: c + '.UI_RT_ICON_CERTIFIED_SCORE', label: 'Rotten Tomatoes Certified From', type: 'number', def: 9.0, min: 0, max: 10, step: 0.1, desc: 'The score (0 to 10) from which that icon is shown.' },
            { path: c + '.LIMIT_MAX_RATINGS', label: 'Most Ratings', type: 'number', def: 6, min: 0, max: 11, step: 1, desc: 'How many outside ratings are shown at most; 0 shows all.' },
            { path: c + '.SOURCE_ORDER', label: 'Sources', type: 'order', def: RATINGS_SOURCES.map(function (s) { return s[1]; }),
                items: RATINGS_SOURCES.map(function (s) { return [s[1], s[2], c + '.SOURCES.' + s[0] + '.enabled']; }),
                desc: 'The outside ratings in the order they are shown; a source without a tick is left out.' });
        return f;
    }

    var HOVER_TYPES = [
        ['CONFIG_SETS', 'Collections', { maxPosters: 100, width: 110, sort: 'PremiereDate', extra: [['showYearInTitle', 'Year in Title', true, 'Shows the year after each title.']] }],
        ['CONFIG_TVSHOWS', 'Series', { maxPosters: 100, width: 110, sort: 'PremiereDate', extra: [
            ['skipSingleSeason', 'Skip a Single Season', true, 'Shows no seasons for a series with only one.'],
            ['singleSeasonShowEpisodesInstead', 'Episodes Instead', true, 'For a series with one season, shows its episodes instead.']] }],
        ['CONFIG_TVSEASONS', 'Seasons', { maxPosters: 100, height: 165, aspect: '2/3, 1/1, 4/3, 16/9', fallback: '2/3', sort: 'PremiereDate', extra: [
            ['showSeasonEpisodeNumberInTitle', 'Episode Number in Title', true, 'Puts "S1:E2 – " in front of each title.']] }],
        ['CONFIG_HOMEVIDEOS', 'Home Video Folders', { maxPosters: 33, height: 165, aspect: '2/3, 1/1, 4/3, 16/9, 9/16', fallback: '2/3', sort: 'Random', zone: true, homeFolders: true }],
        ['CONFIG_MOVIES', 'Movie Chapters', { maxPosters: 100, height: 165, fallback: '16/9' }],
        ['CONFIG_EPISODES', 'Episode Chapters', { maxPosters: 100, height: 165, fallback: '16/9', zone: true }],
        ['CONFIG_HOMEVIDEOFILES', 'Home Video Chapters', { maxPosters: 100, height: 165, fallback: '16/9' }]
    ];
    function hoverSections() {
        var sections = [{ title: 'Where', fields: [
            { path: 'GLOBAL_SETTINGS.enablePreviewsOnHome', label: 'Home', type: 'bool', def: true, desc: 'Previews on the home screen.' },
            { path: 'GLOBAL_SETTINGS.enablePreviewsOnSimilarSection', label: 'More Like This', type: 'bool', def: true, desc: 'Previews in "More Like This" on detail pages.' },
            { path: 'GLOBAL_SETTINGS.enablePreviewsOnNextUp', label: 'Next Up', type: 'bool', def: true, desc: 'Previews in "Next Up".' }] }];
        HOVER_TYPES.forEach(function (t) {
            var c = t[0], o = t[2];
            var basic = [
                { path: c + '.enabled', label: 'Preview', type: 'bool', def: true, desc: 'Shows the preview on these cards.' },
                { path: c + '.centerHoverOnly', label: 'Only Over the Middle', type: 'bool', def: true, desc: 'Opens only while the mouse rests over the middle of the card.' },
                { path: c + '.centerHoverOnlyDelay', label: 'Wait Over the Middle', type: 'number', def: 1500, min: 0, step: 50, unit: 'ms', desc: 'How long the mouse rests over the middle before the preview opens.' },
                { path: c + '.hoverDelay', label: 'Wait Over the Card', type: 'number', def: 220, min: 0, step: 10, unit: 'ms', desc: 'How long the mouse rests on the card before the preview opens, when the whole card counts.' },
                { path: c + '.maxPosters', label: 'Most Tiles', type: 'number', def: o.maxPosters, min: 1, step: 1, desc: 'How many tiles are shown; the rest is counted as "+N".' },
                { path: c + '.subtileFocusPlayButton', label: 'Play Button on Tiles', type: 'bool', def: true, desc: 'Shows a play button on the tile under the mouse.' }
            ];
            if (o.sort) basic.push(
                { path: c + '.sortBy', label: 'Sort', type: 'select', def: o.sort, options: SORTS, desc: 'The order of the tiles.' },
                { path: c + '.sortOrder', label: 'Sort Order', type: 'select', def: 'Ascending', options: ORDERS, desc: 'The direction of the sort.' });
            (o.extra || []).forEach(function (e) { basic.push({ path: c + '.' + e[0], label: e[1], type: 'bool', def: e[2], desc: e[3] }); });
            if (o.homeFolders) basic.push(
                { path: c + '.separateSortForFoldersAndVideos', label: 'Folders and Videos Apart', type: 'bool', def: false, desc: 'Sorts folders and videos each on their own.' },
                { path: c + '.folderSortBy', label: 'Folder Sort', type: 'select', def: 'SortName', options: SORTS, desc: 'The order of the folders, when sorted apart.' },
                { path: c + '.folderSortOrder', label: 'Folder Sort Order', type: 'select', def: 'Ascending', options: ORDERS, desc: 'The direction of the folder sort.' },
                { path: c + '.videoSortBy', label: 'Video Sort', type: 'select', def: 'Random', options: SORTS, desc: 'The order of the videos, when sorted apart.' },
                { path: c + '.videoSortOrder', label: 'Video Sort Order', type: 'select', def: 'Ascending', options: ORDERS, desc: 'The direction of the video sort.' },
                { path: c + '.mixedOrderMode', label: 'First', type: 'select', def: 'foldersFirst', options: [['foldersFirst', 'Folders'], ['videosFirst', 'Videos']], desc: 'Whether folders or videos come first.' },
                { path: c + '.skipFolderLayerNamesEnabled', label: 'Skip Wrapper Folders', type: 'bool', def: true, desc: 'Looks through a folder that only holds another folder with one of the names below.' },
                { path: c + '.skipFolderLayerNames', label: 'Wrapper Folder Names', type: 'text', def: 'videos', desc: 'Folder names that count as wrappers, separated by commas.' },
                { path: c + '.skipFolderLayerExactMatchEnabled', label: 'Exact Name', type: 'bool', def: true, desc: 'A folder whose name is exactly one of them is skipped.' },
                { path: c + '.skipFolderLayerFuzzyFallbackEnabled', label: 'Name Contains', type: 'bool', def: true, desc: 'A folder whose name only contains one of them is skipped too.' },
                { path: c + '.maxFolderSkipDepth', label: 'Skip Depth', type: 'number', def: 1, min: 0, step: 1, desc: 'How many wrapper folders in a row are skipped at most.' });
            var advanced = [];
            if (o.width) advanced.push({ path: c + '.posterWidth', label: 'Tile Width', type: 'number', def: o.width, min: 20, step: 1, unit: 'px', desc: 'The width of a tile.' });
            if (o.height) advanced.push({ path: c + '.posterHeight', label: 'Tile Height', type: 'number', def: o.height, min: 20, step: 1, unit: 'px', desc: 'The height of a tile.' });
            if (o.aspect) advanced.push(
                { path: c + '.autoDetectAspectRatio', label: 'Find the Shape', type: 'bool', def: true, desc: 'Takes the tile shape from the pictures.' },
                { path: c + '.aspectRatioCandidates', label: 'Shapes', type: 'text', def: o.aspect, desc: 'The shapes a tile snaps to, separated by commas.' });
            if (o.fallback) advanced.push({ path: c + '.fallbackAspectRatio', label: 'Shape Otherwise', type: 'text', def: o.fallback, desc: 'The tile shape when none is found.' });
            advanced.push(
                { path: c + '.maxSpreadDeg', label: 'Widest Fan', type: 'number', def: 110, min: 0, step: 1, unit: '°', desc: 'The widest angle of the fan.' },
                { path: c + '.degPerPoster', label: 'Angle per Tile', type: 'number', def: 16, min: 0, step: 1, unit: '°', desc: 'How much the fan widens per tile.' },
                { path: c + '.lift', label: 'Lift', type: 'number', def: 130, min: 0, step: 1, unit: 'px', desc: 'How high the fan rises above the card.' },
                { path: c + '.overlap', label: 'Overlap', type: 'number', def: 0.5, min: 0, max: 1, step: 0.05, desc: 'How much of a tile lies over the card, from 0 to 1.' },
                { path: c + '.hoverPushDeg', label: 'Push Aside', type: 'number', def: 11, min: 0, step: 1, unit: '°', desc: 'How far the neighbours of the tile under the mouse move aside.' },
                { path: c + '.hoverSpreadScale', label: 'Spread While Moving', type: 'number', def: 1.06, min: 1, step: 0.01, desc: 'How much the fan widens while the mouse moves over it.' },
                { path: c + '.smoothing', label: 'Smoothing', type: 'number', def: 0.18, min: 0, max: 1, step: 0.01, desc: 'How quickly the fan follows the mouse, from 0 to 1.' },
                { path: c + '.staggerMs', label: 'Stagger', type: 'number', def: 28, min: 0, step: 1, unit: 'ms', desc: 'The delay between the tiles as they open.' },
                { path: c + '.closeMs', label: 'Closing', type: 'number', def: 220, min: 0, step: 10, unit: 'ms', desc: 'How long the fan takes to close.' });
            if (c === 'CONFIG_SETS') advanced.push({ path: c + '.scrollSettleMs', label: 'After Scrolling', type: 'number', def: 160, min: 0, step: 10, unit: 'ms',
                desc: 'How long the page must rest after scrolling before a preview opens; this one value holds for all cards.' });
            if (o.zone) advanced.push({ path: c + '.centerHoverZoneRatio', label: 'Middle Area', type: 'number', def: 0.22, min: 0.05, max: 1, step: 0.01,
                desc: 'The size of the middle area, as a part of the card, for cards without a play button.' });
            advanced.push(
                { path: c + '.subtilePlayButtonSizeRatio', label: 'Play Button Size', type: 'number', def: 0.4, min: 0.1, max: 1, step: 0.05, desc: 'The size of the play button, as a part of the tile.' },
                { path: c + '.directPlayButtonTimeoutMs', label: 'Wait for Play', type: 'number', def: 4000, min: 0, step: 100, unit: 'ms', desc: 'How long a click waits for Jellyfin\'s own play button.' },
                { path: c + '.directPlayRevealDelayMs', label: 'Black Before Playing', type: 'number', def: 500, min: 0, step: 50, unit: 'ms', desc: 'How long the screen stays black before the video shows.' });
            sections.push({ title: t[1], fields: basic });
            sections.push({ title: t[1] + ': Look and Motion', advanced: true, fields: advanced });
        });
        return sections;
    }

    var SCHEMA = [
        { part: 'random', tab: 'Random', title: 'Random Button', desc: 'A die in the header opens a random title of the library you are in; a double-click starts the auto mode, a triple-click changes its time.',
            header: 'random',
            sections: [
                { title: 'Libraries', fields: [
                    { path: 'MOVIES_PARENT_ID', label: 'Movies', type: 'library', collection: 'movies', def: '', desc: 'The movie library the die picks from.' },
                    { path: 'TVSHOWS_PARENT_ID', label: 'Shows', type: 'library', collection: 'tvshows', def: '', desc: 'The show library the die picks from.' },
                    { path: 'COLLECTIONS_PARENT_ID', label: 'Collections', type: 'library', collection: 'boxsets', def: '', desc: 'The collection library the die picks from.' },
                    { path: 'HOME1_PARENT_ID', label: 'Home Videos 1', type: 'library', collection: 'homevideos', def: '', desc: 'A home video library the die picks from.' },
                    { path: 'HOME2_PARENT_ID', label: 'Home Videos 2', type: 'library', collection: 'homevideos', def: '', desc: 'A second home video library the die picks from.' }] },
                { title: 'Auto Mode', fields: [
                    { path: 'timerStates', label: 'Times', type: 'numberList', def: [3, 6, 12, 24, 48], min: 1, unit: 's', desc: 'The times a triple-click steps through, in seconds, separated by commas.' },

    function apply(config) {
        var known = SCHEMA.map(function (p) { return p.part; });
        enabled = (config.EnabledParts || known).filter(function (k) { return known.indexOf(k) >= 0; });
        var keys = HEADER_BUTTONS.map(function (b) { return b[0]; });
        headerOrder = (config.HeaderOrder || []).filter(function (k) { return keys.indexOf(k) >= 0; });
        keys.forEach(function (k) { if (headerOrder.indexOf(k) < 0) headerOrder.push(k); });
        var settings = config.Settings;
        if (typeof settings === 'string') { try { settings = JSON.parse(settings || '{}'); } catch (e) { settings = {}; } }
        values = {};
        Object.keys(settings || {}).forEach(function (part) {
            if (known.indexOf(part) < 0) return;
            var fields = {};
            allFields(part).forEach(function (f) {
                fields[f.path] = f;
                if (f.type === 'order') f.items.forEach(function (it) { fields[it[2]] = { type: 'bool' }; });
            });
            Object.keys(settings[part] || {}).forEach(function (path) {
                var f = Object.prototype.hasOwnProperty.call(fields, path) ? fields[path] : null;
                if (f && valid(f, settings[part][path])) { values[part] = values[part] || {}; values[part][path] = settings[part][path]; }
            });
        });
    }

    // Copies of these scripts in the JavaScript Injector run first and ignore the settings here: name them.
    var SCRIPT_SIGNS = [['Random', 'randomMovieButton'], ['Autoscroll', 'jf-scroll-btn'], ['Fullscreen', 'jf-fullscreen-btn'],
        ['Details Group Items Extended', 'data-omdb-row'], ['Details Group Items Sets', 'data-collection-row'], ['MediaInfo Ratings', 'MDBListRatings'],
        ['Hover Preview Tiles', '__jfCollectionPreviewLoaded'], ['Keyboard Library Navigation', '__jfKeyboardLibraryNav']];
    function warnInjector(plugins) {
        var injector = plugins.filter(function (p) { return /JavaScript Injector/i.test(p.Name) && p.Status === 'Active'; })[0];
        if (!injector) return;
        ApiClient.getPluginConfiguration(injector.Id).then(function (c) {
            var found = (c.CustomJavaScripts || []).filter(function (s) { return s.Enabled; }).map(function (s) {
                var sign = SCRIPT_SIGNS.filter(function (x) { return (s.Script || '').indexOf(x[1]) >= 0; })[0];
                return sign ? s.Name + ' (' + sign[0] + ')' : null;
            }).filter(Boolean);
            var box = $('esInjectorWarning');
            if (box && found.length) {
                box.textContent = 'The JavaScript Injector still runs ' + found.join(', ') + '. Turn these entries off, or the settings here do not reach those scripts.';
                box.hidden = false;
            }
        }, function () {});
    }

    page.addEventListener('pageshow', function () {
        Dashboard.showLoadingMsg();
        Promise.all([
            ApiClient.getPluginConfiguration(EssentialsConfig.pluginUniqueId),
            ApiClient.getJSON(ApiClient.getUrl('Library/VirtualFolders')).catch(function () { return []; }),
            ApiClient.getInstalledPlugins().catch(function () { return []; })
        ]).then(function (r) {
            libraries = r[1] || [];
            installed = {};
            (r[2] || []).forEach(function (p) { if (p.Status === 'Active') installed[plainId(p.Id)] = true; });
            try {
                apply(r[0]);
                loaded = true;
                drawTabs();
                showTab('general');
                warnInjector(r[2] || []);
            } finally {
                Dashboard.hideLoadingMsg();
            }
        }, function () {
            Dashboard.hideLoadingMsg();
            Dashboard.alert('Loading the settings failed.');
        });
    });

    $('EssentialsConfigForm').addEventListener('submit', function (e) {
        e.preventDefault();
        if (!loaded) return false;
        page.querySelectorAll('[data-path]:not([data-order])').forEach(readField);
        Dashboard.showLoadingMsg();
        ApiClient.getPluginConfiguration(EssentialsConfig.pluginUniqueId).then(function (config) {
            config.EnabledParts = enabled;
            config.HeaderOrder = headerOrder;
            var saved = {};
            Object.keys(values).forEach(function (part) { if (Object.keys(values[part]).length) saved[part] = values[part]; });
            config.Settings = JSON.stringify(saved);
            return ApiClient.updatePluginConfiguration(EssentialsConfig.pluginUniqueId, config);
        }).then(function (result) {
            Dashboard.processPluginConfigurationUpdateResult(result);
        }, function () {
            Dashboard.hideLoadingMsg();
            Dashboard.alert('Saving the settings failed.');
        });
        return false;
    });
})();
</script>
</div>
</body>
</html>
